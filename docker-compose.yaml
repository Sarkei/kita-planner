services:
  kita-planner:
    container_name: kita-planner
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4466"
      KITAPL_WEB_ROOT: /app/web
      # Bewusst leer: die App baut die Verbindung aus den POSTGRES_*-Werten (Host = postgres).
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-kita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kita_planner}
      # Text: DeepSeek (günstig) oder Mistral; Bilder nur mit Mistral.
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-auto}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_TEXT_MODEL: ${DEEPSEEK_TEXT_MODEL:-deepseek-chat}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_TEXT_MODEL: ${MISTRAL_TEXT_MODEL:-mistral-large-latest}
      MISTRAL_IMAGE_CONVERSATION_MODEL: ${MISTRAL_IMAGE_CONVERSATION_MODEL:-mistral-medium-latest}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-120}
    ports:
      - "4466:4466"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4466/api/health", "-o", "/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always
    networks:
      - default
      - cloudflare

  postgres:
    container_name: kita-planner-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kita_planner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Kein Port nach außen: die Datenbank ist nur im Compose-Netz erreichbar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    networks:
      - default

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
  cloudflare:
    external: true
    # Name des bereits existierenden Tunnels-Netzes auf dem NAS
    name: ${TUNNEL_NETWORK:-cloudflare-tunnel-net}
