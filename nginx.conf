# Legacy: Früheres nginx-Frontend-Image. Das aktuelle Docker-Image liefert Statik und /api in einem Node/Express-Prozess — diese Datei wird dafür nicht mehr gebaut.
server {
    listen 4466;
    include /etc/nginx/mime.types;
    client_max_body_size 50M;

    # Docker Embedded DNS — Backend-IP nach Restarts zuverlässig auflösen (sonst 502 dauerhaft).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        set $kita_backend http://backend:5000;
        proxy_pass $kita_backend$request_uri;
        proxy_http_version 1.1;
        # Kein WebSocket-Upgrade für REST (Tunnel/Cloudflare).
        proxy_set_header Connection "";
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
